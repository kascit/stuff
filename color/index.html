<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Converter | dhanur.me</title>

        sidebarNav: [],

        badge: { text: "CONVERTER", class: "badge-success" },
        showSearch: false,

    <script src="https://dhanur.me/js/shell.min.js" defer></script>
    <link rel="stylesheet" href="https://dhanur.me/css/dui.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="min-h-screen bg-base-100 text-base-content antialiased pt-20">
    <div class="navbar site-topbar fixed top-0 left-0 right-0 z-50 h-16 border-b border-base-content/10 bg-base-100/80 backdrop-blur-md">
        <div class="flex-none lg:hidden">
            <button id="shell-mobile-toggle" type="button" aria-label="Open menu" class="btn btn-ghost btn-circle btn-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>
        <div class="flex-1 flex justify-center items-center lg:flex lg:justify-start">
            <a href="https://dhanur.me/" class="btn btn-ghost hover:bg-transparent hover:border-transparent normal-case text-xl font-bold text-base-content logo-firefly site-logo-link">
                <div class="relative h-18 flex items-center">
                    <picture>
                        <img src="https://raw.githubusercontent.com/kascit/kascit.github.io/raw-mirror/images/branding/logo-light.png" alt="~/dhanur" class="h-18 w-auto p-[15px] logo-dark" sizes="200px" />
                    </picture>
                    <picture class="absolute inset-0 flex items-center">
                        <img src="https://raw.githubusercontent.com/kascit/kascit.github.io/raw-mirror/images/branding/logo-dark.png" alt="~/dhanur" class="h-18 w-auto p-[15px] logo-light" sizes="200px" />
                    </picture>
                </div>
            </a>
        </div>
        <div class="flex-none hidden lg:flex">
            <ul class="menu menu-horizontal px-1 items-center">
                <li data-nav-chrome="apps" class="ml-1">
                    <div class="relative p-0" data-dropdown="apps">
                        <div tabindex="0" role="button" class="btn btn-ghost btn-square tooltip tooltip-bottom" data-tooltip-label="Apps" aria-label="Apps">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                        </div>
                        <div class="dropdown-panel z-50 mt-2 p-4 bg-base-100 border border-base-content/10 rounded-box w-64 right-0 mr-2 md:mr-4">
                            <div class="grid grid-cols-3 gap-2" data-app-menu-grid="desktop">
                                <div class="col-span-3 flex justify-center py-4 opacity-50"><span class="loading loading-spinner loading-sm"></span></div>
                            </div>
                        </div>
                    </div>
                </li>
                <li data-nav-chrome="account" class="ml-1">
                    <div class="relative p-0" data-dropdown="account">
                        <div tabindex="0" role="button" class="btn btn-ghost btn-circle tooltip tooltip-bottom" data-tooltip-label="Account" aria-label="Account">
                            <div data-auth="nav-guest-avatar" class="w-9 h-9 rounded-full bg-base-300 flex items-center justify-center">
                                <i class="fa-solid fa-user text-base-content/50 text-sm"></i>
                            </div>
                        </div>
                        <div class="dropdown-panel z-50 mt-2 bg-base-100 border border-base-content/10 rounded-box w-64 right-0 mr-2 md:mr-4 overflow-hidden">
                            <div class="px-3 pt-3 pb-2 border-b border-base-content/10 cursor-default select-none">
                                <div class="font-semibold text-sm">Ecosystem Account</div>
                                <div class="text-xs opacity-60">Sign in for cross-app synchronization</div>
                            </div>
                            <ul class="menu p-2">
                                <li data-nav-chrome="theme">
                                    <div class="flex items-center gap-2.5 px-2.5 py-2">
                                        <i class="fa-solid fa-circle-half-stroke w-4 text-center opacity-60"></i>
                                        <div id="theme-toggle" class="theme-switcher w-full bg-base-300/70 text-xs font-medium">
                                            <button data-theme-mode="light" class="theme-switcher-btn rounded-md px-2 py-1.5"><i class="fa-solid fa-sun mr-1"></i>Light</button>
                                            <button data-theme-mode="dark" class="theme-switcher-btn rounded-md px-2 py-1.5"><i class="fa-solid fa-moon mr-1"></i>Dark</button>
                                            <button data-theme-mode="auto" class="theme-switcher-btn rounded-md px-2 py-1.5"><i class="fa-solid fa-circle-half-stroke mr-1"></i>Auto</button>
                                        </div>
                                    </div>
                                </li>
                                <li><a class="flex items-center gap-3" href="https://auth.dhanur.me/"><i class="fa-solid fa-right-to-bracket w-4 text-center"></i><span>Sign In</span></a></li>
                            </ul>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>

    <!-- Mobile Panel -->
    <div id="shell-mobile-panel" class="fixed inset-0 z-[100] hidden" data-shell-mobile-panel>
        <div class="absolute inset-0 bg-black/50" data-shell-mobile-backdrop></div>
        <div class="absolute top-0 left-0 bottom-0 w-72 bg-base-100 shadow-2xl flex flex-col overflow-y-auto" data-shell-mobile-drawer>
            <div class="flex items-center justify-between px-4 py-3 border-b border-base-content/10">
                <a href="https://dhanur.me/" class="font-bold text-lg text-base-content">dhanur.me</a>
                <button type="button" class="btn btn-ghost btn-circle btn-sm" data-shell-mobile-close aria-label="Close menu">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="px-4 py-3 border-b border-base-content/10">
                <a href="/stuff/" class="btn btn-sm btn-ghost w-full justify-start"><i class="fa-solid fa-arrow-left mr-2"></i>Back to Stuff</a>
            </div>
        </div>
    </div>
    <main class="w-full max-w-lg mx-auto p-4 flex flex-col items-center justify-center min-h-[calc(100vh-6rem)]">
        <div class="dui-surface w-full">
            <div class="dui-surface-body p-6 space-y-4">
                <div class="text-center mb-6">
                    <div class="flex items-center justify-center w-12 h-12 rounded-xl bg-success/10 border border-success/20 text-success mx-auto mb-3">
                        <i class="fa-solid fa-palette text-2xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold">Color Converter</h1>
                    <p class="text-sm text-base-content/60">HEX, RGB, HSL conversions</p>
                </div>

                <!-- Color Preview -->
                <div id="preview" class="h-24 rounded-xl border-2 border-base-content/10 shadow-inner transition-colors" style="background: #3b82f6;"></div>

                <!-- HEX Input -->
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-base-content/70">HEX</label>
                    <div class="flex gap-2">
                        <span class="dui-input flex items-center justify-center w-10">#</span>
                        <input id="hex" type="text" class="dui-input flex-1 font-mono uppercase" placeholder="3B82F6" maxlength="6" value="3B82F6" oninput="fromHex()">
                    </div>
                </div>

                <!-- RGB Inputs -->
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-base-content/70">RGB</label>
                    <div class="grid grid-cols-3 gap-2">
                        <input id="r" type="number" min="0" max="255" class="dui-input font-mono" placeholder="R" oninput="fromRGB()">
                        <input id="g" type="number" min="0" max="255" class="dui-input font-mono" placeholder="G" oninput="fromRGB()">
                        <input id="b" type="number" min="0" max="255" class="dui-input font-mono" placeholder="B" oninput="fromRGB()">
                    </div>
                </div>

                <!-- HSL Inputs -->
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-base-content/70">HSL</label>
                    <div class="grid grid-cols-3 gap-2">
                        <div class="relative">
                            <input id="h" type="number" min="0" max="360" class="dui-input font-mono pr-6" placeholder="H" oninput="fromHSL()">
                            <span class="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-base-content/50">°</span>
                        </div>
                        <div class="relative">
                            <input id="s" type="number" min="0" max="100" class="dui-input font-mono pr-6" placeholder="S" oninput="fromHSL()">
                            <span class="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-base-content/50">%</span>
                        </div>
                        <div class="relative">
                            <input id="l" type="number" min="0" max="100" class="dui-input font-mono pr-6" placeholder="L" oninput="fromHSL()">
                            <span class="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-base-content/50">%</span>
                        </div>
                    </div>
                </div>

                <!-- CSS Output -->
                <div class="bg-base-200/50 border border-base-content/10 rounded-xl p-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-semibold text-base-content/40 uppercase">CSS</span>
                        <button class="dui-btn dui-btn-xs dui-btn-ghost" onclick="copyCSS()">
                            <i class="fa-solid fa-copy"></i>
                        </button>
                    </div>
                    <code id="css-output" class="text-sm font-mono block">background-color: #3b82f6;</code>
                </div>

                <div class="flex gap-2">
                    <button class="dui-btn dui-btn-ghost flex-1 text-sm" onclick="randomColor()">
                        <i class="fa-solid fa-shuffle mr-2"></i>Random
                    </button>
                    <button class="dui-btn dui-btn-ghost text-sm" onclick="shareColor()">
                        <i class="fa-solid fa-link"></i>
                    </button>
                </div>
            </div>
        </div>
    
        <footer class="mt-8 text-center text-xs text-base-content/40 mb-8">
            <p><a href="/stuff/" class="hover:text-base-content underline">← Back to Stuff Playground</a> &bull; Part of <a href="https://dhanur.me/" class="underline hover:text-base-content">dhanur.me</a></p>
        </footer>
    </main>

    <script type="module">
        import { API, Color } from '../js-shared/api-core.js';

        function updatePreview(hex) {
            document.getElementById('preview').style.background = hex;
            document.getElementById('css-output').textContent = `background-color: ${hex};`;
        }

        window.fromHex = () => {
            let hex = document.getElementById('hex').value.replace('#', '');
            if (hex.length !== 6) return;

            const rgb = Color.hexToRgb(hex);
            const hsl = Color.rgbToHsl(rgb.r, rgb.g, rgb.b);

            document.getElementById('r').value = rgb.r;
            document.getElementById('g').value = rgb.g;
            document.getElementById('b').value = rgb.b;
            document.getElementById('h').value = hsl.h;
            document.getElementById('s').value = hsl.s;
            document.getElementById('l').value = hsl.l;

            updatePreview('#' + hex);
            API.setParam('hex', hex);
        };

        window.fromRGB = () => {
            const r = parseInt(document.getElementById('r').value) || 0;
            const g = parseInt(document.getElementById('g').value) || 0;
            const b = parseInt(document.getElementById('b').value) || 0;

            const hex = Color.rgbToHex(r, g, b);
            const hsl = Color.rgbToHsl(r, g, b);

            document.getElementById('hex').value = hex.replace('#', '');
            document.getElementById('h').value = hsl.h;
            document.getElementById('s').value = hsl.s;
            document.getElementById('l').value = hsl.l;

            updatePreview(hex);
            API.setParams({ r, g, b });
        };

        window.fromHSL = () => {
            const h = parseInt(document.getElementById('h').value) || 0;
            const s = parseInt(document.getElementById('s').value) || 0;
            const l = parseInt(document.getElementById('l').value) || 0;

            const rgb = Color.hslToRgb(h, s, l);
            const hex = Color.rgbToHex(rgb.r, rgb.g, rgb.b);

            document.getElementById('hex').value = hex.replace('#', '');
            document.getElementById('r').value = rgb.r;
            document.getElementById('g').value = rgb.g;
            document.getElementById('b').value = rgb.b;

            updatePreview(hex);
            API.setParams({ h, s, l });
        };

        window.randomColor = () => {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);

            document.getElementById('r').value = r;
            document.getElementById('g').value = g;
            document.getElementById('b').value = b;

            fromRGB();
        };

        window.copyCSS = async () => {
            const css = document.getElementById('css-output').textContent;
            if (await API.copy(css)) {
                API.toast('CSS copied!');
            }
        };

        window.shareColor = () => {
            const hex = document.getElementById('hex').value;
            const url = API.share({ hex });
            API.copy(url);
            API.toast('Color link copied!');
        };

        // Auto-init
        API.autoInit((params) => {
            if (params.hex) {
                document.getElementById('hex').value = params.hex.replace('#', '');
                fromHex();
            } else if (params.r !== undefined) {
                document.getElementById('r').value = params.r;
                document.getElementById('g').value = params.g || 0;
                document.getElementById('b').value = params.b || 0;
                fromRGB();
            } else if (params.h !== undefined) {
                document.getElementById('h').value = params.h;
                document.getElementById('s').value = params.s || 50;
                document.getElementById('l').value = params.l || 50;
                fromHSL();
            } else {
                // Default blue
                fromHex();
            }
        });
    </script>
</body>
</html>
