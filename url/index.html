<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Tools | dhanur.me</title>
    <script>
    window.SiteNavConfig = {
        mode: "navbar",
        nav: [
            { name: "Stuff", url: "/stuff/", icon: "fa-solid fa-grid" },
            { name: "Home", url: "https://dhanur.me/", icon: "fa-solid fa-house" }
        ],
        sidebarNav: [],
        activePath: window.location.pathname,
        badge: { text: "ENCODER", class: "badge-warning" },
        showSearch: false,
        showAppsGrid: true,
        showThemeToggle: true
    };
    </script>
    <script src="https://dhanur.me/js/shell.min.js" defer></script>
    <link rel="stylesheet" href="https://dhanur.me/css/dui.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="min-h-screen bg-base-100 text-base-content antialiased pt-20">
    <div class="navbar site-topbar fixed top-0 left-0 right-0 z-50 h-16 border-b border-base-content/10 bg-base-100/80 backdrop-blur-md">
        <div class="flex-none lg:hidden">
            <button id="shell-mobile-toggle" type="button" aria-label="Open menu" class="btn btn-ghost btn-circle btn-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>
        <div class="flex-1 flex justify-center items-center lg:flex lg:justify-start">
            <a href="https://dhanur.me/" class="btn btn-ghost hover:bg-transparent hover:border-transparent normal-case text-xl font-bold text-base-content logo-firefly site-logo-link">
                <div class="relative h-18 flex items-center">
                    <picture>
                        <img src="https://raw.githubusercontent.com/kascit/kascit.github.io/raw-mirror/images/branding/logo-light.png" alt="~/dhanur" class="h-18 w-auto p-[15px] logo-dark" sizes="200px" />
                    </picture>
                    <picture class="absolute inset-0 flex items-center">
                        <img src="https://raw.githubusercontent.com/kascit/kascit.github.io/raw-mirror/images/branding/logo-dark.png" alt="~/dhanur" class="h-18 w-auto p-[15px] logo-light" sizes="200px" />
                    </picture>
                </div>
            </a>
        </div>
        <div class="flex-none hidden lg:flex">
            <ul class="menu menu-horizontal px-1 items-center">
                <li data-nav-chrome="apps" class="ml-1">
                    <div class="relative p-0" data-dropdown="apps">
                        <div tabindex="0" role="button" class="btn btn-ghost btn-square tooltip tooltip-bottom" data-tooltip-label="Apps" aria-label="Apps">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                        </div>
                        <div class="dropdown-panel z-50 mt-2 p-4 bg-base-100 border border-base-content/10 rounded-box w-64 right-0 mr-2 md:mr-4">
                            <div class="grid grid-cols-3 gap-2" data-app-menu-grid="desktop">
                                <div class="col-span-3 flex justify-center py-4 opacity-50"><span class="loading loading-spinner loading-sm"></span></div>
                            </div>
                        </div>
                    </div>
                </li>
                <li data-nav-chrome="account" class="ml-1">
                    <div class="relative p-0" data-dropdown="account">
                        <div tabindex="0" role="button" class="btn btn-ghost btn-circle tooltip tooltip-bottom" data-tooltip-label="Account" aria-label="Account">
                            <div data-auth="nav-guest-avatar" class="w-9 h-9 rounded-full bg-base-300 flex items-center justify-center">
                                <i class="fa-solid fa-user text-base-content/50 text-sm"></i>
                            </div>
                        </div>
                        <div class="dropdown-panel z-50 mt-2 bg-base-100 border border-base-content/10 rounded-box w-64 right-0 mr-2 md:mr-4 overflow-hidden">
                            <div class="px-3 pt-3 pb-2 border-b border-base-content/10 cursor-default select-none">
                                <div class="font-semibold text-sm">Ecosystem Account</div>
                                <div class="text-xs opacity-60">Sign in for cross-app synchronization</div>
                            </div>
                            <ul class="menu p-2">
                                <li data-nav-chrome="theme">
                                    <div class="flex items-center gap-2.5 px-2.5 py-2">
                                        <i class="fa-solid fa-circle-half-stroke w-4 text-center opacity-60"></i>
                                        <div id="theme-toggle" class="theme-switcher w-full bg-base-300/70 text-xs font-medium">
                                            <button data-theme-mode="light" class="theme-switcher-btn rounded-md px-2 py-1.5"><i class="fa-solid fa-sun mr-1"></i>Light</button>
                                            <button data-theme-mode="dark" class="theme-switcher-btn rounded-md px-2 py-1.5"><i class="fa-solid fa-moon mr-1"></i>Dark</button>
                                            <button data-theme-mode="auto" class="theme-switcher-btn rounded-md px-2 py-1.5"><i class="fa-solid fa-circle-half-stroke mr-1"></i>Auto</button>
                                        </div>
                                    </div>
                                </li>
                                <li><a class="flex items-center gap-3" href="https://auth.dhanur.me/"><i class="fa-solid fa-right-to-bracket w-4 text-center"></i><span>Sign In</span></a></li>
                            </ul>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>

    <!-- Mobile Panel -->
    <div id="shell-mobile-panel" class="fixed inset-0 z-[100] hidden" data-shell-mobile-panel>
        <div class="absolute inset-0 bg-black/50" data-shell-mobile-backdrop></div>
        <div class="absolute top-0 left-0 bottom-0 w-72 bg-base-100 shadow-2xl flex flex-col overflow-y-auto" data-shell-mobile-drawer>
            <div class="flex items-center justify-between px-4 py-3 border-b border-base-content/10">
                <a href="https://dhanur.me/" class="font-bold text-lg text-base-content">dhanur.me</a>
                <button type="button" class="btn btn-ghost btn-circle btn-sm" data-shell-mobile-close aria-label="Close menu">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="px-4 py-3 border-b border-base-content/10">
                <a href="/stuff/" class="btn btn-sm btn-ghost w-full justify-start"><i class="fa-solid fa-arrow-left mr-2"></i>Back to Stuff</a>
            </div>
        </div>
    </div>
    <main class="w-full max-w-2xl mx-auto p-4 flex flex-col items-center justify-center min-h-[calc(100vh-6rem)]">
        <div class="dui-surface w-full">
            <div class="dui-surface-body p-6 space-y-4">
                <div class="text-center mb-6">
                    <div class="flex items-center justify-center w-12 h-12 rounded-xl bg-warning/10 border border-warning/20 text-warning mx-auto mb-3">
                        <i class="fa-solid fa-link text-2xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold">URL Tools</h1>
                    <p class="text-sm text-base-content/60">Encode, decode, and parse URLs</p>
                </div>

                <div class="flex gap-2">
                    <button class="dui-btn dui-btn-sm dui-btn-primary" onclick="setMode('encode')" id="btn-encode">Encode</button>
                    <button class="dui-btn dui-btn-sm dui-btn-ghost" onclick="setMode('decode')" id="btn-decode">Decode</button>
                    <button class="dui-btn dui-btn-sm dui-btn-ghost" onclick="setMode('parse')" id="btn-parse">Parse URL</button>
                    <button class="dui-btn dui-btn-sm dui-btn-ghost" onclick="setMode('params')" id="btn-params">Query Params</button>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-semibold text-base-content/70" id="input-label">Text to Encode</label>
                    <textarea id="input" class="dui-input w-full text-sm font-mono" rows="3" placeholder="Enter text..." oninput="process()"></textarea>
                </div>

                <div class="flex gap-2" id="action-buttons">
                    <button class="dui-btn dui-btn-primary flex-1" onclick="process()">
                        <i class="fa-solid fa-arrow-right mr-2"></i>Encode
                    </button>
                    <button class="dui-btn dui-btn-ghost" onclick="swap()">
                        <i class="fa-solid fa-arrow-right-arrow-left"></i>
                    </button>
                </div>

                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="text-sm font-semibold text-base-content/70">Output</label>
                        <button class="dui-btn dui-btn-xs dui-btn-ghost" onclick="copyOutput()">
                            <i class="fa-solid fa-copy"></i>
                        </button>
                    </div>
                    <div id="output-container">
                        <textarea id="output" class="dui-input w-full text-sm font-mono bg-base-200/50" rows="3" readonly></textarea>
                    </div>
                </div>

                <div id="parsed-result" class="hidden space-y-2">
                    <!-- Parsed URL results -->
                </div>

                <div class="flex gap-2">
                    <button class="dui-btn dui-btn-ghost flex-1 text-sm" onclick="clearAll()">
                        <i class="fa-solid fa-trash mr-2"></i>Clear
                    </button>
                    <button class="dui-btn dui-btn-ghost text-sm" onclick="shareLink()">
                        <i class="fa-solid fa-link"></i>
                    </button>
                </div>
            </div>
        </div>
    
        <footer class="mt-8 text-center text-xs text-base-content/40 mb-8">
            <p><a href="/stuff/" class="hover:text-base-content underline">← Back to Stuff Playground</a> &bull; Part of <a href="https://dhanur.me/" class="underline hover:text-base-content">dhanur.me</a></p>
        </footer>
    </main>

    <script type="module">
        import { API, URLUtil } from '../js-shared/api-core.js';

        let currentMode = 'encode';

        window.setMode = (mode) => {
            currentMode = mode;
            document.getElementById('btn-encode').className = mode === 'encode' ? 'dui-btn dui-btn-sm dui-btn-primary' : 'dui-btn dui-btn-sm dui-btn-ghost';
            document.getElementById('btn-decode').className = mode === 'decode' ? 'dui-btn dui-btn-sm dui-btn-primary' : 'dui-btn dui-btn-sm dui-btn-ghost';
            document.getElementById('btn-parse').className = mode === 'parse' ? 'dui-btn dui-btn-sm dui-btn-primary' : 'dui-btn dui-btn-sm dui-btn-ghost';
            document.getElementById('btn-params').className = mode === 'params' ? 'dui-btn dui-btn-sm dui-btn-primary' : 'dui-btn dui-btn-sm dui-btn-ghost';

            const labels = {
                encode: 'Text to Encode',
                decode: 'URL to Decode',
                parse: 'URL to Parse',
                params: 'Query String'
            };
            document.getElementById('input-label').textContent = labels[mode];

            const btnText = mode === 'encode' ? 'Encode' : mode === 'decode' ? 'Decode' : mode === 'parse' ? 'Parse' : 'Extract';
            document.querySelector('#action-buttons .dui-btn-primary').innerHTML = `<i class="fa-solid fa-arrow-right mr-2"></i>${btnText}`;

            document.getElementById('parsed-result').classList.toggle('hidden', mode !== 'parse');
            document.getElementById('output-container').classList.toggle('hidden', mode === 'parse');

            process();
        };

        window.process = () => {
            const input = document.getElementById('input').value;
            if (!input) {
                document.getElementById('output').value = '';
                return;
            }

            try {
                let output;
                switch (currentMode) {
                    case 'encode':
                        output = URLUtil.encode(input);
                        break;
                    case 'decode':
                        output = URLUtil.decode(input);
                        break;
                    case 'parse':
                        const parsed = URLUtil.parse(input);
                        renderParsed(parsed);
                        API.setParams({ mode: currentMode, input });
                        return;
                    case 'params':
                        const params = URLUtil.parse(input);
                        output = JSON.stringify(params.params, null, 2);
                        break;
                }
                document.getElementById('output').value = output;
                API.setParams({ mode: currentMode, input });
            } catch (e) {
                document.getElementById('output').value = 'Error: ' + e.message;
            }
        };

        window.swap = () => {
            const input = document.getElementById('input');
            const output = document.getElementById('output');
            const temp = input.value;
            input.value = output.value;
            output.value = temp;
        };

        window.copyOutput = async () => {
            const output = document.getElementById('output').value;
            if (output && await API.copy(output)) {
                API.toast('Copied!');
            }
        };

        window.clearAll = () => {
            document.getElementById('input').value = '';
            document.getElementById('output').value = '';
            document.getElementById('parsed-result').innerHTML = '';
        };

        window.shareLink = () => {
            const input = document.getElementById('input').value;
            if (input) {
                const url = API.share({ mode: currentMode, input });
                API.copy(url);
                API.toast('Link copied!');
            }
        };

        function renderParsed(parsed) {
            const container = document.getElementById('parsed-result');
            const fields = [
                { key: 'protocol', label: 'Protocol' },
                { key: 'hostname', label: 'Hostname' },
                { key: 'port', label: 'Port' },
                { key: 'pathname', label: 'Path' },
                { key: 'search', label: 'Query' },
                { key: 'hash', label: 'Hash' }
            ];

            let html = '<div class="space-y-2">';
            fields.forEach(({ key, label }) => {
                const value = parsed[key];
                if (value) {
                    html += `
                        <div class="bg-base-200/30 p-3 rounded-lg">
                            <div class="text-[10px] text-base-content/40 uppercase">${label}</div>
                            <div class="font-mono text-sm">${value}</div>
                        </div>
                    `;
                }
            });

            if (Object.keys(parsed.params).length > 0) {
                html += `
                    <div class="bg-base-200/30 p-3 rounded-lg">
                        <div class="text-[10px] text-base-content/40 uppercase">Query Parameters</div>
                        <pre class="font-mono text-sm mt-1">${JSON.stringify(parsed.params, null, 2)}</pre>
                    </div>
                `;
            }

            html += '</div>';
            container.innerHTML = html;
        }

        // Auto-init
        API.autoInit((params) => {
            if (params.mode) setMode(params.mode);
            if (params.input) {
                document.getElementById('input').value = params.input;
                process();
            }
        });
    </script>
</body>
</html>
